name: CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main']

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ZendeskMcp.slnx

      - name: Build
        run: dotnet build ZendeskMcp.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ZendeskMcp.slnx --no-build -c Release --verbosity normal

      - name: Build Docker image
        run: docker build -f src/ZendeskMcp.Server/Dockerfile -t zendesk-mcp:ci .
