name: Deploy

# Builds and deploys the server to Azure App Service (code deploy, .NET).
# Wire up before enabling:
#   Secret:  AZURE_WEBAPP_PUBLISH_PROFILE
#   Var:     AZURE_WEBAPP_NAME   (the App Service name)
# The App Service supplies all environment-specific config (TRANSPORT=http,
# ASPNETCORE_ENVIRONMENT=Production, Zendesk/AzureAd/OAuth settings, Key Vault refs).

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore & test
        run: |
          dotnet restore ZendeskMcp.slnx
          dotnet test ZendeskMcp.slnx --no-restore -c Release

      - name: Publish
        run: dotnet publish src/ZendeskMcp.Server/ZendeskMcp.Server.csproj -c Release -o ./publish

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
