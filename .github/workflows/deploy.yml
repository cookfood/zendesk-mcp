name: Deploy

# Builds the container, pushes it to GitHub Container Registry, and deploys to
# Azure App Service (for Containers). Wire up the secrets/vars noted below before
# enabling.
#
#   Secrets:  AZURE_WEBAPP_PUBLISH_PROFILE
#   Vars:     AZURE_WEBAPP_NAME   (the App Service name)
#
# The App Service must be configured to pull from ghcr.io and to set the runtime
# app settings: TRANSPORT=http, ASPNETCORE_ENVIRONMENT=Production, the Zendesk
# credentials (ideally via Key Vault references), AzureAd:* and OAuth:*.

on:
  push:
    branches: ['main']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/ZendeskMcp.Server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.IMAGE }}:${{ github.sha }}
